[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringblast"
version = "0.1.6"
description = "Open-source design of ring (fan) blast patterns, charging and Kuz-Ram fragmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stefano Bonduà", email = "stefano.bondua@unibo.it" }, { name = "F. Tinti" }, { name = "Mohamed Elkarmoty" }]
dependencies = ["numpy>=1.24", "ezdxf>=1.1", "matplotlib>=3.7"]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "opencv-python-headless>=4.8", "pillow>=10", "python-docx>=1.1"]
test = ["pytest>=7"]

[project.scripts]
ringblast = "ringblast.cli:main"
ringblast-gui = "ringblast.gui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
