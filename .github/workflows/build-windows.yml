name: Build portable Windows program

# Run it from the Actions tab (Run workflow) or by pushing a tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release and attach the zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]" pyinstaller
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python launcher/build_portable.py
      - name: Self-test of the built program
        run: dist\RingBlast\RingBlast.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: RingBlast-portable-windows
          path: dist/RingBlast-portable-*.zip
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RingBlast-portable-*.zip
