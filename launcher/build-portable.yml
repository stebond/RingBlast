name: Build portable programs

# Run it from the Actions tab (Run workflow) or by pushing a tag such as v0.1.4.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release and attach the archives

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows
            exe: dist\RingBlast\RingBlast.exe
            archive: dist/RingBlast-portable-*.zip
          - os: ubuntu-22.04      # older glibc: the program also runs on older distributions
            tag: linux
            exe: dist/RingBlast/RingBlast
            archive: dist/RingBlast-portable-*.tar.gz
          - os: macos-14          # Apple Silicon (M1/M2/M3...)
            tag: macos
            exe: dist/RingBlast.app/Contents/MacOS/RingBlast
            archive: dist/RingBlast-portable-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]" pyinstaller
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python launcher/build_portable.py
      - name: Self-test of the built program
        run: ${{ matrix.exe }} --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: RingBlast-portable-${{ matrix.tag }}
          path: ${{ matrix.archive }}
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
